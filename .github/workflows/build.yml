

name: Build INVADER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparer les fichiers web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Installer Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6

      - name: Configurer INVADER
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.invader.assistant",
            "appName": "INVADER",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Creer le projet Android
        run: npx cap add android

      - name: Synchroniser le projet
        run: npx cap sync android

      - name: Compiler le APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Recuperer le APK
        uses: actions/upload-artifact@v4
        with:
          name: INVADER-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

